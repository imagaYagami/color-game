<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>いろいろ まぜる (직관적인 색상 버전)</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            /* 새 업데이트 확인용 연한 회색 배경 */
            background-color: #f4f6f8; 
            font-family: 'Zen Maru Gothic', 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 10px;
            height: 100vh;
            touch-action: none; 
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .title {
            font-size: 38px;
            font-weight: 900;
            color: #8a2be2;
            margin-top: 20px;
            margin-bottom: 5px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px #fff, 4px 4px 0px #d4b8f5;
        }
        
        .sub-title {
            font-size: 16px;
            color: #555;
            margin-bottom: 25px;
            font-weight: bold;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1 / 1;
        }

        .wheel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #top-wheel {
            cursor: grab;
            transform-origin: 50% 50%;
        }
        #top-wheel:active {
            cursor: grabbing;
        }

        .text-bg {
            transition: fill 0.3s ease; 
        }
    </style>
</head>
<body>

    <div class="title">いろいろ まぜる</div>
    <div class="sub-title">まわして いろを つくろう！ (돌려서 섞어봐요)</div>

    <div id="game-container">
        
        <!-- 1. 고정된 밑판 (Base Wheel) -->
        <svg id="base-wheel" class="wheel" viewBox="0 0 600 600">
            <defs>
                <path id="blob" d="M -96.4 -114.9 A 150 150 0 0 1 96.4 -114.9" fill="none" stroke-linecap="round" />
            </defs>
            <circle cx="300" cy="300" r="230" fill="white" stroke="#555" stroke-width="5" />
            
            <!-- 빨강 -->
            <g transform="translate(300,300) rotate(60)">
                <use href="#blob" stroke="#555" stroke-width="62" />
                <use href="#blob" stroke="#ff1a40" stroke-width="50" />
                <text x="0" y="-195" font-size="26" font-weight="900" fill="#555" text-anchor="middle">あか</text>
            </g>
            <!-- 노랑 -->
            <g transform="translate(300,300) rotate(180)">
                <use href="#blob" stroke="#555" stroke-width="62" />
                <use href="#blob" stroke="#ffea00" stroke-width="50" />
                <text x="0" y="-195" font-size="26" font-weight="900" fill="#555" text-anchor="middle">きいろ</text>
            </g>
            <!-- 파랑 -->
            <g transform="translate(300,300) rotate(300)">
                <use href="#blob" stroke="#555" stroke-width="62" />
                <use href="#blob" stroke="#0088ff" stroke-width="50" />
                <text x="0" y="-195" font-size="26" font-weight="900" fill="#555" text-anchor="middle">あお</text>
            </g>
        </svg>

        <!-- 2. 돌아가는 윗판 (Top Wheel) -->
        <svg id="top-wheel" class="wheel" viewBox="0 0 600 600">
            <circle cx="300" cy="300" r="230" fill="transparent" stroke="#555" stroke-width="5" />

            <g transform="translate(300,300) rotate(300)">
                <path d="M 220 -25 C 260 -25 260 25 220 25" fill="white" stroke="#555" stroke-width="5" />
                <path d="M 235 -10 L 235 10 M 245 -10 L 245 10" stroke="#555" stroke-width="4" stroke-linecap="round" />
            </g>

            <!-- 윗판 반투명 셀로판지 (비율을 0.7로 최적화하여 섞이는 색이 더 잘 나오게 조정) -->
            <g transform="translate(300,300) rotate(60)">
                <use href="#blob" stroke="#0088ff" stroke-width="50" opacity="0.7" />
            </g>
            <g transform="translate(300,300) rotate(180)">
                <use href="#blob" stroke="#ff1a40" stroke-width="50" opacity="0.7" />
            </g>
            <g transform="translate(300,300) rotate(300)">
                <use href="#blob" stroke="#ffea00" stroke-width="50" opacity="0.7" />
            </g>

            <!-- 이름 캡슐 (흰색 글씨 가독성을 위해 stroke 테두리 적용) -->
            <g transform="translate(300,300) rotate(60)">
                <rect id="bg-0" class="text-bg" x="-60" y="-165" width="120" height="40" rx="20" fill="white" stroke="#333" stroke-width="3" />
                <text id="text-0" x="0" y="-137" font-size="22" font-weight="900" text-anchor="middle" stroke-width="1" stroke-linejoin="round"></text>
            </g>
            <g transform="translate(300,300) rotate(180)">
                <rect id="bg-1" class="text-bg" x="-60" y="-165" width="120" height="40" rx="20" fill="white" stroke="#333" stroke-width="3" />
                <text id="text-1" x="0" y="-137" font-size="22" font-weight="900" text-anchor="middle" stroke-width="1" stroke-linejoin="round"></text>
            </g>
            <g transform="translate(300,300) rotate(300)">
                <rect id="bg-2" class="text-bg" x="-60" y="-165" width="120" height="40" rx="20" fill="white" stroke="#333" stroke-width="3" />
                <text id="text-2" x="0" y="-137" font-size="22" font-weight="900" text-anchor="middle" stroke-width="1" stroke-linejoin="round"></text>
            </g>

            <circle cx="300" cy="300" r="14" fill="white" stroke="#555" stroke-width="5" />
            <circle cx="300" cy="300" r="4" fill="#333" />
        </svg>
    </div>

    <script>
        const topWheel = document.getElementById('top-wheel');
        const container = document.getElementById('game-container');
        
        let isDragging = false;
        let startAngle = 0;
        let currentRotation = -120; 
        
        function updateColorFeedback(rotation) {
            let steps = Math.round(rotation / 120);
            let normalizedSteps = ((steps % 3) + 3) % 3;

            // ★ 발달장애 아동을 위한 뚜렷하고 직관적인 크레파스 원색 모음 ★
            const colorMurasaki = "#9c27b0"; // 아주 선명하고 뚜렷한 보라색
            const colorMidori   = "#00c853"; // 아주 쨍하고 직관적인 초록색
            const colorOrange   = "#ff8c00"; // 선명한 귤색/주황색
            const colorAo       = "#007bff"; // 새파란 파란색
            const colorAka      = "#ff3b30"; // 새빨간 빨간색
            const colorKiiro    = "#ffea00"; // 밝은 노란색

            // 캡슐 색상과 글자색을 적용하는 함수
            function applyStyle(idx, name, bgColor, textColor) {
                const txt = document.getElementById('text-' + idx);
                const bg = document.getElementById('bg-' + idx);
                
                txt.textContent = name;
                bg.style.fill = bgColor;
                
                // 글씨 색상 적용 (노란색일 때만 검은 글씨, 나머지는 모두 흰 글씨!)
                txt.setAttribute("fill", textColor);
                // 흰 글씨가 배경에 묻히지 않도록 얇은 검은 테두리 추가
                txt.setAttribute("stroke", textColor === "#ffffff" ? "#111" : "none"); 
            }

            if (normalizedSteps === 0) {
                applyStyle(0, "むらさき", colorMurasaki, "#ffffff");
                applyStyle(1, "おれんじ", colorOrange, "#ffffff");
                applyStyle(2, "みどり", colorMidori, "#ffffff");
            } else if (normalizedSteps === 1) {
                applyStyle(0, "みどり", colorMidori, "#ffffff");
                applyStyle(1, "むらさき", colorMurasaki, "#ffffff");
                applyStyle(2, "おれんじ", colorOrange, "#ffffff");
            } else if (normalizedSteps === 2) {
                applyStyle(0, "あお", colorAo, "#ffffff");
                applyStyle(1, "あか", colorAka, "#ffffff");
                applyStyle(2, "きいろ", colorKiiro, "#222222"); // 노랑은 검은 글씨
            }
        }

        updateColorFeedback(currentRotation);
        topWheel.style.transform = `rotate(${currentRotation}deg)`;
        
        let center = { x: 0, y: 0 };

        function calculateCenter() {
            const rect = container.getBoundingClientRect();
            center.x = rect.left + rect.width / 2;
            center.y = rect.top + rect.height / 2;
        }

        function getAngle(e) {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return Math.atan2(clientY - center.y, clientX - center.x) * (180 / Math.PI);
        }

        function onDragStart(e) {
            e.preventDefault();
            isDragging = true;
            calculateCenter();
            startAngle = getAngle(e) - currentRotation;
            topWheel.style.transition = 'none'; 
        }

        function onDragMove(e) {
            if (!isDragging) return;
            e.preventDefault();
            currentRotation = getAngle(e) - startAngle;
            topWheel.style.transform = `rotate(${currentRotation}deg)`;
            updateColorFeedback(currentRotation);
        }

        function onDragEnd() {
            if (!isDragging) return;
            isDragging = false;
            
            const snapAngle = Math.round(currentRotation / 120) * 120;
            currentRotation = snapAngle;
            
            topWheel.style.transition = 'transform 0.3s cubic-bezier(0.25, 0.1, 0.25, 1)';
            topWheel.style.transform = `rotate(${currentRotation}deg)`;
            updateColorFeedback(currentRotation);
        }

        topWheel.addEventListener('mousedown', onDragStart);
        window.addEventListener('mousemove', onDragMove);
        window.addEventListener('mouseup', onDragEnd);
        window.addEventListener('mouseleave', onDragEnd);

        topWheel.addEventListener('touchstart', onDragStart, { passive: false });
        window.addEventListener('touchmove', onDragMove, { passive: false });
        window.addEventListener('touchend', onDragEnd);
    </script>

</body>
</html>
